# CI validation only — production deploy owner is cPanel Git + .cpanel.yml
#
# Safety:
# - push@main and workflow_dispatch run validation only
# - no FTP upload
# - no production mutation from GitHub Actions

name: Validate kadirabi

concurrency:
  group: validate-kadirabi
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate (test / typecheck / build / artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Validate deploy artifact + owners
        run: npm run verify:deploy
